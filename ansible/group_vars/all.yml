---
afric_user: africbuilder
afric_root: /srv/africandroid
afric_repo: https://github.com/olamidebello/africandroid-.git
afric_revision: main
# Set a reviewed commit SHA for reproducible deployments.
aosp_branch: android-latest-release
release_config: aosp_current
sync_jobs: 8
build_jobs: 8
run_sync: true
run_build: true
# These gates verify readiness; they cannot create missing translations/features.
strict_feature_gate: false
required_app_locales: []
# Directory on the Ansible controller with reviewed JSON packs; empty uses bundled packs.
translation_source: ""
install_cuttlefish_host: false
# Pin a known-good upstream commit before enabling host installation.
cuttlefish_revision: ""

# Build-time location policy; monitoring and launcher restrictions stay opt-in.
geofencing_sample_interval_ms: 30000
geofencing_max_sample_age_ms: 180000
geofencing_event_history_limit: 200

# Native Olamide integration is blocked until a signed, compatible APK is supplied.
olamide_enabled: false
olamide_apk_source: ""
olamide_apk_sha256: ""
apk_analyzer_path: /opt/android-sdk/cmdline-tools/latest/bin/apkanalyzer
apk_signer_path: /opt/android-sdk/build-tools/35.0.0/apksigner

# Build the repository's customized native dialer before optional OS preload.
build_native_dialer: false
native_android_sdk: "{{ afric_root }}/android-sdk"
native_gradle_path: "{{ afric_root }}/native-tools/gradle-8.13/bin/gradle"
provision_native_build_tools: true
