plugins { id 'com.android.application' }
android {
    namespace 'com.dobhrap.olamide'
    compileSdk 35
    defaultConfig { applicationId 'com.dobhrap.olamide'; minSdk 30; targetSdk 35; versionCode 1; versionName '0.1.0'; ndk { abiFilters 'arm64-v8a', 'x86_64' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'org.linphone.no-video:linphone-sdk-android:5.4.128' }
